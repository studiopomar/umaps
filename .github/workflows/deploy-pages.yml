name: Verificar e publicar o uMapas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar ferramentas de verificação
        run: npm ci

      - name: Conferir módulos JavaScript
        run: for file in js/*.js; do node --check "$file"; done

      - name: Executar testes de estado
        run: npm test

      - name: Instalar Chromium para testes de navegador
        run: npx playwright install --with-deps chromium

      - name: Testar a experiência no navegador
        run: npm run test:browser

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp -R index.html style.css favicon.ico data js vendor _site/
          mkdir -p _site/assets
          cp assets/avatar.svg _site/assets/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
